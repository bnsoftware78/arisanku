<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d5b4c">
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Arisan Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0d5b4c;--deep:#083d35;--gold:#d9a84e;--gold2:#f0cf8a;--mint:#e8f4ef;--ink:#18332e;--muted:#70827d;--line:#e3ebe7;--serif:'Cormorant Garamond',Georgia,serif;--pat:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='none' stroke='%23d9a84e' stroke-width='1' stroke-opacity='.17'><rect x='13' y='13' width='38' height='38'/><rect x='13' y='13' width='38' height='38' transform='rotate(45 32 32)'/><circle cx='32' cy='32' r='9'/></g></svg>")}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font:14px 'Plus Jakarta Sans',system-ui,sans-serif;background:#f3f6f4;color:var(--ink);-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer}
.wrap{max-width:720px;margin:auto;padding:0 16px calc(50px + env(safe-area-inset-bottom))}
.top{padding:16px 0}.top b{font:700 22px var(--serif);display:block}.top small{font-size:10px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px 22px;color:#fff;background:linear-gradient(135deg,var(--green),var(--deep));box-shadow:0 22px 44px -22px var(--deep);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero:before{content:"";position:absolute;inset:0;background-image:var(--pat);background-size:80px;-webkit-mask-image:linear-gradient(100deg,transparent 10%,#000 90%);mask-image:linear-gradient(100deg,transparent 10%,#000 90%)}.hero>*{position:relative}
.eb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold2);font-weight:600}.hero h1{font:700 30px/1.1 var(--serif);margin:8px 0 6px}.hero p{margin:0;color:#c3dcd3;font-size:12.5px;line-height:1.55}
.chip{display:inline-block;margin-top:12px;font-size:11px;background:#ffffff16;border:1px solid #ffffff2a;border-radius:99px;padding:5px 11px;color:#e6f2ee}
.stp{display:inline-block;margin:12px 0 0 8px;transform:rotate(-5deg);border:2px double currentColor;border-radius:7px;padding:3px 10px;font-size:12px;font-weight:800;letter-spacing:1.5px;background:#ffffffee}.stp.l{color:#1b7a4a}.stp.n{color:#c0392b}
.ring{position:relative;width:128px;height:128px;display:grid;place-items:center}.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}.ring b{font:700 30px var(--serif);display:block;text-align:center}.ring small{display:block;text-align:center;font-size:9px;letter-spacing:1px;color:#bcd6cc;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 12px 30px -16px #0d3a2e30}.card h2{font:700 22px var(--serif);margin:0 0 4px}.sub{font-size:11.5px;color:var(--muted);margin:0 0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.k{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 12px;position:relative;overflow:hidden}.k:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),var(--gold))}
.k small{display:block;font-size:10.5px;color:var(--muted)}.k b{display:block;font:700 20px var(--serif);margin-top:6px;color:#183c32}
.win{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff7e6,#fff);border:1px solid #f1dcae;border-radius:18px;padding:16px 18px;margin-top:16px}.win .t{font:700 24px var(--serif)}
.tl{list-style:none;padding:0;margin:0}.tl li{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed #e1e9e5;align-items:center}.tl li:last-child{border:0}.tl .d{width:38px;height:38px;border-radius:12px;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:700;flex:none;font-size:12px}.tl b{display:block;font-size:13px}.tl small{color:var(--muted);font-size:11px}.tl .r{margin-left:auto;text-align:right}
.tag{display:inline-block;border-radius:99px;padding:3px 9px;font-size:10px;background:#eaf5ed;color:#37805b}.tag.p{background:#fff5e4;color:#a87521}
.rek{display:flex;align-items:center;gap:10px;background:var(--mint);border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.5;white-space:pre-line}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:12px}input,select{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;color:var(--ink);background:#fff}input:focus,select:focus{outline:2px solid #0d5b4c55;border-color:var(--green)}
.btn{width:100%;border:0;border-radius:13px;padding:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--green),var(--deep));box-shadow:0 10px 20px -10px var(--green)}.btn:disabled{opacity:.6}
.sec{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:12px;color:#46645a;white-space:nowrap;margin-left:auto}.wa{display:block;text-align:center;text-decoration:none;color:var(--green);font-weight:600;font-size:12.5px;margin-top:14px}
.empty{text-align:center;color:var(--muted);padding:22px 10px}.err{background:#fdecea;color:#b3261e;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-top:12px}.ok{background:#eaf5ed;color:#2c7a55;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-top:12px}
.center{min-height:80vh;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
@media(max-width:520px){.hero{grid-template-columns:1fr;padding:20px 16px}.ring{margin:auto;order:-1}.hero h1{font-size:25px}.k b{font-size:15px}input,select{font-size:16px}.wrap{padding:0 12px 40px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">Memuat…</div></div>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
import {SUPABASE_URL,SUPABASE_KEY} from "./supabase-config.js";
const sb=createClient(SUPABASE_URL,SUPABASE_KEY),$=s=>document.querySelector(s),TK=(new URLSearchParams(location.search).get('t')||'').replace(/[^a-f0-9]/gi,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const sh=n=>n>=1e9?'Rp '+(n/1e9).toFixed(2).replace('.',',')+' M':n>=1e6?'Rp '+(n/1e6).toFixed(1).replace('.',',')+' jt':rp(n);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const dark=(h,f)=>{const n=parseInt(h.slice(1),16);return '#'+[n>>16,n>>8&255,n&255].map(c=>Math.round(c*f).toString(16).padStart(2,'0')).join('')};
const wal=n=>{let d=String(n||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d};
const METODE=['Transfer bank','Virtual account','Setor tunai','QRIS'];
function shrink(file,maxW,qual){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',qual))};img.onerror=()=>rej(new Error('File harus berupa gambar (JPG/PNG)'));img.src=u})}
let P=null;
async function load(){
 if(!TK){$('#app').innerHTML='<div class="center">Tautan tidak lengkap. Mintalah tautan pribadi Anda kepada pengurus arisan.</div>';return}
 try{const {data:s,error:er}=await sb.rpc('get_portal',{p_token:TK});if(er)throw er;if(!s){$('#app').innerHTML='<div class="center">Tautan tidak valid atau sudah tidak aktif.<br>Silakan hubungi pengurus arisan.</div>';return}P=s;draw()}
 catch(e){$('#app').innerHTML='<div class="center">Koneksi bermasalah. Periksa internet Anda lalu muat ulang halaman.</div>'}}
function draw(){const w=/^#[0-9a-f]{6}$/i.test(P.warna||'')?P.warna:'#0d5b4c',r=document.documentElement.style;r.setProperty('--green',w);r.setProperty('--deep',dark(w,.62));document.title='Arisan '+P.nama+' — '+P.grup;
 const per=P.periode=='mingguan'?'minggu':'bulan',okS=(P.bayar||[]).filter(x=>x.st=='ok'),sumP=p=>okS.filter(x=>x.p==p).reduce((a,x)=>a+x.v,0),now=sumP(P.putaran),lun=P.iuran>0&&now>=P.iuran,pc=P.iuran?Math.min(100,now/P.iuran*100):0,tot=okS.reduce((a,x)=>a+x.v,0),kurang=Math.max(0,P.iuran-now),R=56,C=2*Math.PI*R;
 const pend=(P.bayar||[]).filter(x=>x.st!='ok'&&x.p==P.putaran).reduce((a,x)=>a+x.v,0),mw=(P.undian||[]).find(x=>x.p==P.menang);
 $('#app').innerHTML=`<div class="top"><b>${esc(P.grup)}</b><small>Arisan ${per=='minggu'?'mingguan':'bulanan'}</small></div>
<section class="hero"><div><div class="eb">Assalamu’alaikum Warahmatullah</div><h1>${esc(P.nama)}</h1><p>Berikut perkembangan iuran dan jadwal undian arisan Anda.</p><span class="chip">Putaran ke-${P.putaran} dari ${P.jml}</span><span class="stp ${lun?'l':'n'}">${lun?'✓ LUNAS':'BELUM LUNAS'}</span></div>
<div class="ring"><svg width="128" height="128" viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="#ffffff22" stroke-width="9"/><circle cx="66" cy="66" r="${R}" fill="none" stroke="#e7bd71" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc/100)}"/></svg><div><b>${pc.toFixed(0)}%</b><small>Putaran ini</small></div></div></section>
<section class="grid3"><div class="k"><small>Iuran per ${per}</small><b>${sh(P.iuran)}</b></div><div class="k"><small>Kurang putaran ini</small><b>${lun?'Lunas':sh(kurang)}</b></div><div class="k"><small>Hadiah per putaran</small><b>${sh(P.pot)}</b></div></section>
${pend?`<div class="ok" style="background:#fff7e6;color:#7d5a14;margin-top:14px">◷ Setoran ${rp(pend)} menunggu konfirmasi pengurus.</div>`:''}
<div class="win"><span style="font-size:30px">${P.menang?'🏆':'🎲'}</span><div><small style="color:var(--muted)">Giliran Anda</small><div class="t">${P.menang?`Putaran ke-${P.menang}${mw?' · '+fd(mw.tgl):''}`:'Belum mendapat giliran'}</div></div></div>
<section class="card"><h2>Daftar pemenang</h2><p class="sub">Hasil undian tiap putaran</p>${(P.undian||[]).length?`<ul class="tl">${[...P.undian].sort((a,b)=>a.p-b.p).map(x=>`<li><span class="d">${x.p}</span><span><b>${esc(x.nama)}</b><small>${fd(x.tgl)}</small></span>${x.nama==P.nama?'<span class="r"><span class="tag">Anda</span></span>':''}</li>`).join('')}</ul>`:'<div class="empty">Undian pertama belum dilakukan.</div>'}</section>
<section class="card"><h2>Riwayat iuran saya</h2><p class="sub">Total terkonfirmasi ${rp(tot)}</p>${(P.bayar||[]).length?`<ul class="tl">${P.bayar.slice(0,20).map(x=>`<li><span class="d">${x.p}</span><span><b>${rp(x.v)}</b><small>${fd(x.tgl)} · ${esc(x.m)} · putaran ke-${x.p}</small></span><span class="r"><span class="tag ${x.st=='ok'?'':'p'}">${x.st=='ok'?'Terkonfirmasi':'Menunggu'}</span></span></li>`).join('')}</ul>`:'<div class="empty">Belum ada iuran.</div>'}</section>
<section class="card"><h2>Kirim bukti transfer</h2><p class="sub">Transfer ke rekening berikut, lalu unggah buktinya.</p>
${P.rek?`<div class="rek"><span id="rk" style="flex:1">${esc(P.rek)}</span><button class="sec" id="cp">Salin</button></div>`:'<div class="empty">Rekening belum diatur oleh pengurus.</div>'}
<form id="f" style="margin-top:16px"><label>Nominal (Rp)<input name="v" type="number" inputmode="numeric" min="1" value="${kurang||P.iuran}" required></label><label>Tanggal transfer<input name="tgl" type="date" value="${iso(new Date())}" max="${iso(new Date())}" required></label><label>Metode<select name="m">${METODE.map(m=>`<option>${m}</option>`).join('')}</select></label><label>Foto bukti transfer<input name="foto" type="file" accept="image/*" required></label><button class="btn" id="sb">Kirim bukti transfer</button><div id="fm"></div></form>
${P.wa?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${wal(P.wa)}?text=${encodeURIComponent('Assalamu’alaikum, saya '+P.nama+' ingin bertanya tentang arisan '+P.grup+'.')}">Ada pertanyaan? Hubungi pengurus lewat WhatsApp →</a>`:''}</section>`;
 const cp=$('#cp');if(cp)cp.onclick=()=>navigator.clipboard?.writeText($('#rk').textContent).then(()=>{cp.textContent='Tersalin ✓';setTimeout(()=>cp.textContent='Salin',2000)});
 $('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),fm=$('#fm'),sb=$('#sb');sb.disabled=true;sb.textContent='Mengirim…';fm.innerHTML='';
  try{let b=await shrink(f.get('foto'),900,.6);if(b.length>380000)b=await shrink(f.get('foto'),640,.5);if(b.length>380000)throw new Error('Foto terlalu besar. Coba foto/screenshot yang lebih kecil.');
   {const {error:er}=await sb.rpc('kirim_bukti',{p_token:TK,p_v:+f.get('v'),p_tgl:f.get('tgl'),p_m:f.get('m'),p_bukti:b});if(er)throw er}
   e.target.reset();fm.innerHTML='<div class="ok">✓ Jazakumullahu khairan. Bukti transfer terkirim dan menunggu konfirmasi pengurus.</div>';sb.disabled=false;sb.textContent='Kirim bukti transfer'}
  catch(x){fm.innerHTML='<div class="err">'+esc((x.code=='P0001'||x.code=='42501')?'Gagal mengirim. Hubungi pengurus arisan.':(x.message||'Gagal mengirim, coba lagi.'))+'</div>';sb.disabled=false;sb.textContent='Kirim bukti transfer'}}}
load();
</script>
</body></html>
